name: Micro.blog 24/7 Auto Bot

on:
  schedule:
    - cron: '0 */5 * * *'  # يعيد التشغيل تلقائياً كل 5 ساعات
  workflow_dispatch:        # يتيح التشغيل اليدوي بأي وقت

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Micro.blog Bot (Continuous Mode)
        env:
          MICRO_TOKEN: ${{ secrets.MICRO_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python micro_bot.py
